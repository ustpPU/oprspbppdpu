     \u003ch3 class=\"text-xs font-bold uppercase text-slate-700\">Lampiran Gambar\u003c/h3>\n              \u003cp class=\"text-[11px] text-slate-500 italic\">Disyorkan gambar format melintang (landscape).\u003c/p>\n\n              \u003cdiv class=\"p-3 border border-slate-300 rounded-xl bg-slate-50 space-y-2\">\n                \u003cspan class=\"text-xs font-bold text-slate-800 block\">Gambar 1 (Hero Utama)\u003c/span>\n                \u003cinput type=\"file\" id=\"fileImg1\" accept=\"image/*\" onchange=\"processAndUploadImage(event, 1)\" class=\"text-xs text-slate-600\">\n                \u003cbutton type=\"button\" id=\"editImgBtn1\" onclick=\"openImageEditor(1)\" class=\"hidden px-2.5 py-1.5 bg-white border border-slate-300 rounded-lg text-[11px] font-bold text-slate-700 hover:bg-slate-100\">\u003ci class=\"fa-solid fa-arrows-up-down-left-right mr-1\">\u003c/i>Reposition\u003c/button>\n              \u003c/div>\n\n              \u003cdiv class=\"grid grid-cols-1 md:grid-cols-3 gap-2\">\n                \u003cdiv class=\"p-2.5 border border-slate-300 rounded-xl bg-slate-50 space-y-1.5\">\n                  \u003cspan class=\"text-[11px] font-bold text-slate-700 block\">Gambar 2\u003c/span>\n                  \u003cinput type=\"file\" id=\"fileImg2\" accept=\"image/*\" onchange=\"processAndUploadImage(event, 2)\" class=\"text-[10px] text-slate-600 w-full\">\n                  \u003cinput type=\"text\" id=\"kapsyen2\" oninput=\"updatePreview()\" placeholder=\"Kapsyen 2\" class=\"w-full bg-white border border-slate-300 rounded px-2 py-1 text-[11px]\">\n                  \u003cbutton type=\"button\" id=\"editImgBtn2\" onclick=\"openImageEditor(2)\" class=\"hidden px-2 py-1 bg-white border border-slate-300 rounded text-[10px] font-bold text-slate-700\">\u003ci class=\"fa-solid fa-arrows-up-down-left-right mr-1\">\u003c/i>Reposition\u003c/button>\n                \u003c/div>\n\n                \u003cdiv class=\"p-2.5 border border-slate-300 rounded-xl bg-slate-50 space-y-1.5\">\n                  \u003cspan class=\"text-[11px] font-bold text-slate-700 block\">Gambar 3\u003c/span>\n                  \u003cinput type=\"file\" id=\"fileImg3\" accept=\"image/*\" onchange=\"processAndUploadImage(event, 3)\" class=\"text-[10px] text-slate-600 w-full\">\n                  \u003cinput type=\"text\" id=\"kapsyen3\" oninput=\"updatePreview()\" placeholder=\"Kapsyen 3\" class=\"w-full bg-white border border-slate-300 rounded px-2 py-1 text-[11px]\">\n                  \u003cbutton type=\"button\" id=\"editImgBtn3\" onclick=\"openImageEditor(3)\" class=\"hidden px-2 py-1 bg-white border border-slate-300 rounded text-[10px] font-bold text-slate-700\">\u003ci class=\"fa-solid fa-arrows-up-down-left-right mr-1\">\u003c/i>Reposition\u003c/button>\n                \u003c/div>\n\n                \u003cdiv class=\"p-2.5 border border-slate-300 rounded-xl bg-slate-50 space-y-1.5\">\n                  \u003cspan class=\"text-[11px] font-bold text-slate-700 block\">Gambar 4\u003c/span>\n                  \u003cinput type=\"file\" id=\"fileImg4\" accept=\"image/*\" onchange=\"processAndUploadImage(event, 4)\" class=\"text-[10px] text-slate-600 w-full\">\n                  \u003cinput type=\"text\" id=\"kapsyen4\" oninput=\"updatePreview()\" placeholder=\"Kapsyen 4\" class=\"w-full bg-white border border-slate-300 rounded px-2 py-1 text-[11px]\">\n                  \u003cbutton type=\"button\" id=\"editImgBtn4\" onclick=\"openImageEditor(4)\" class=\"hidden px-2 py-1 bg-white border border-slate-300 rounded text-[10px] font-bold text-slate-700\">\u003ci class=\"fa-solid fa-arrows-up-down-left-right mr-1\">\u003c/i>Reposition\u003c/button>\n                \u003c/div>\n              \u003c/div>\n            \u003c/div>\n\n            \u003c!-- BUTANG SIMPAN & CETAK -->\n            \u003cdiv class=\"pt-2 flex items-center space-x-3\">\n              \u003cbutton type=\"submit\" id=\"submitBtn\" class=\"flex-1 py-3 bg-slate-900 hover:bg-slate-800 text- d\">\n                    \u003cspan id=\"prevCap4\" class=\"text-[7pt] text-slate-600 italic block mt-0.5 font-medium truncate\">\u003c/span>\n                  \u003c/div>\n                \u003c/div>\n              \u003c/div>\n\n              \u003c!-- FOOTER PREVIEW -->\n              \u003cdiv class=\"pt-1.5 border-t border-slate-300 text-[7.5pt] text-slate-700 flex justify-between items-end page-break-avoid\">\n                \u003cdiv>\n                  \u003cp>\u003cstrong>Disediakan oleh:\u003c/strong> \u003cspan id=\"prevNama\" class=\"font-bold\">\u003c/span> (\u003cspan id=\"prevJawatan\">\u003c/span>)\u003c/p>\n                  \u003cp>\u003cstrong>Tarikh Laporan:\u003c/strong> \u003cspan id=\"prevTarikhLaporan\">\u003c/span>\u003c/p>\n                \u003c/div>\n                \u003cdiv class=\"text-right text-[6.5pt] text-slate-400\">\n                  Sektor Pembelajaran | PPD Petaling Utama\n                \u003c/div>\n              \u003c/div>\n\n              \u003c/div>\n            \u003c/div>\n            \u003c/div>\n          \u003c/div>\n        \u003c/div>\n\n      \u003c/div>\n    \u003c/section>\n\n    \u003c!-- ==================== TAB 3: ARKIB OPR ==================== -->\n    \u003csection id=\"sec-pegawai\" class=\"hidden space-y-6 no-print\">\n      \u003cdiv class=\"glass-card p-6 rounded-2xl shadow-sm\">\n        \u003ch2 class=\"text-lg font-bold text-slate-900 mb-1\">Arkib OPR Pegawai\u003c/h2>\n        \u003cp class=\"text-xs text-slate-500 mb-6\">Pilih pegawai untuk melihat sejarah laporan atau membuat cetakan semula.\u003c/p>\n\n        \u003cdiv id=\"pegawaiGrid\" class=\"grid grid-cols-1 md:grid-cols-3 gap-5\">\u003c/div>\n      \u003c/div>\n    \u003c/section>\n\n  \u003c/main>\n\n  \u003cfooter class=\"fixed inset-x-0 bottom-0 z-40 border-t border-white/15 bg-slate-950/75 text-slate-200 backdrop-blur-md no-print\">\n    \u003cdiv class=\"mx-auto flex h-8 max-w-7xl items-center justify-center px-4 text-[10px] font-semibold tracking-wide sm:h-11 sm:justify-end sm:px-6 sm:text-xs lg:px-8\">\n      Sektor Pembelajaran | PPD Petaling Utama\n    \u003c/div>\n  \u003c/footer>\n\n  \u003c!-- MODAL HISTORY PEGAWAI (NO PRINT) -->\n  \u003cdiv id=\"historyModal\" class=\"fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4 no-print\">\n    \u003cdiv class=\"bg-white rounded-2xl max-w-3xl w-full p-6 shadow-2xl border border-slate-200 max-h-[85vh] flex flex-col\">\n      \u003cdiv class=\"flex justify-between items-center pb-4 border-b border-slate-200\">\n        \u003cdiv>\n          \u003ch3 id=\"modalPegawaiName\" class=\"text-lg font-bold text-slate-900\">Sejarah OPR Pegawai\u003c/h3>\n          \u003cp id=\"modalPegawaiJawatan\" class=\"text-xs text-slate-500\">\u003c/p>\n        \u003c/div>\n        \u003cbutton onclick=\"closeModal()\" class=\"text-slate-400 hover:text-slate-600 text-lg w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center\">\u003ci class=\"fa-solid fa-xmark\">\u003c/i>\u003c/button>\n      \u003c/div>\n\n      \u003cdiv id=\"modalOprList\" class=\"flex-1 overflow-y-auto py-4 space-y-3 custom-scrollbar\">\u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n  \u003c!-- EDITOR GAMBAR -->\n  \u003cdiv id=\"imageEditorModal\" class=\"fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-[70] hidden items-center justify-center p-4 no-print\">\n    \u003cdiv class=\"bg-white rounded-2xl w-full max-w-3xl shadow-2xl overflow-hidden\">\n      \u003cdiv class=\"flex items-center justify-between px-5 py-4 border-b border-slate-200\">\n        \u003cdiv>\n          \u003ch3 class=\"font-extrabold text-slate-900\">Kedudukan Gambar\u003c/h3>\n          \u003cp class=\"text-xs text-slate-500\">Tarik gambar untuk menetapkan kedudukan yang akan muncul dalam pratonton dan PDF.\u003c/p>\n        \u003c/div>\n        \u003cbutton type=\"button\" onclick=\"closeImageEditor()\" class=\"w-9 h-9 rounded-full bg-slate-100 text-slate-600 hover:bg-slate-200\">\u003ci class=\"fa-solid fa-xmark\">\u003c/i>\u003c/button>\n      \u003c/div>\n      \u003cdiv class=\"h-[55vh] min-h-[320px] bg-slate-950 p-3\">\n        \u003cimg id=\"cropperImage\" alt=\"Editor gambar\" class=\"max-w-full block\">\n      \u003c/div>\n      \u003cdiv class=\"px-5 py-4 flex flex-wrap items-center justify-between gap-3\">\n        \u003cdiv class=\"flex items-center gap-2\">\n          \u003cbutton type=\"button\" onclick=\"cropReset()\" class=\"px-3 py-2 rounded-lg border border-slate-300 text-xs font-bold\">\u003ci class=\"fa-solid fa-rotate-left mr-1\">\u003c/i>Kembali Asal\u003c/button>\n        \u003c/div>\n        \u003cdiv class=\"flex items-center gap-2\">\n          \u003cbutton type=\"button\" onclick=\"closeImageEditor()\" class=\"px-4 py-2 rounded-lg bg-slate-100 text-slate-700 text-xs font-bold\">Batal\u003c/button>\n          \u003cbutton type=\"button\" onclick=\"applyImageCrop()\" class=\"px-4 py-2 rounded-lg bg-slate-900 text-white text-xs font-bold\">\u003ci class=\"fa-solid fa-check mr-1\">\u003c/i>Gunakan Gambar\u003c/button>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n  \u003c!-- STATUS SIMPAN & PDF -->\n  \u003cdiv id=\"saveProgressModal\" class=\"fixed inset-0 bg-slate-950/70 backdrop-blur-sm z-[80] hidden items-center justify-center p-4 no-print\">\n    \u003cdiv class=\"bg-white rounded-2xl w-full max-w-md p-6 shadow-2xl\">\n      \u003ch3 class=\"text-lg font-extrabold text-slate-900\">Menyediakan Laporan OPR\u003c/h3>\n      \u003cp class=\"text-xs text-slate-500 mt-1\">Jangan tutup halaman sehingga semua langkah selesai.\u003c/p>\n      \u003cdiv class=\"mt-5 space-y-3\">\n        \u003cdiv id=\"step-images\" class=\"progress-step flex items-center gap-3\" data-status=\"pending\">\n          \u003cspan class=\"step-icon w-8 h-8 rounded-full border-2 border-slate-300 text-slate-400 flex items-center justify-center shrink-0\">\u003ci class=\"fa-solid fa-image\">\u003c/i>\u003c/span>\n          \u003cspan class=\"step-label text-sm text-slate-600\">Memproses gambar…\u003c/span>\n        \u003c/div>\n        \u003cdiv id=\"step-pdf\" class=\"progress-step flex items-center gap-3\" data-status=\"pending\">\n          \u003cspan class=\"step-icon w-8 h-8 rounded-full border-2 border-slate-300 text-slate-400 flex items-center justify-center shrink-0\">\u003ci class=\"fa-solid fa-file-pdf\">\u003c/i>\u003c/span>\n          \u003cspan class=\"step-label text-sm text-slate-600\">Menjana PDF…\u003c/span>\n        \u003c/div>\n        \u003cdiv id=\"step-drive\" class=\"progress-step flex items-center gap-3\" data-status=\"pending\">\n          \u003cspan class=\"step-icon w-8 h-8 rounded-full border-2 border-slate-300 text-slate-400 flex items-center justify-center shrink-0\">\u003ci class=\"fa-brands fa-google-drive\">\u003c/i>\u003c/span>\n          \u003cspan class=\"step-label text-sm text-slate-600\">Menyimpan ke Drive…\u003c/span>\n        \u003c/div>\n        \u003cdiv id=\"step-done\" class=\"progress-step flex items-center gap-3\" data-status=\"pending\">\n          \u003cspan class=\"step-icon w-8 h-8 rounded-full border-2 border-slate-300 text-slate-400 flex items-center justify-center shrink-0\">\u003ci class=\"fa-solid fa-flag-checkered\">\u003c/i>\u003c/span>\n          \u003cspan class=\"step-label text-sm text-slate-600\">Selesai\u003c/span>\n        \u003c/div>\n      \u003c/div>\n      \u003cp id=\"saveProgressMessage\" class=\"hidden mt-4 rounded-lg bg-red-50 border border-red-200 p-3 text-xs text-red-700\">\u003c/p>\n      \u003cbutton id=\"closeProgressBtn\" type=\"button\" onclick=\"closeSaveProgress()\" class=\"hidden mt-4 w-full py-2.5 rounded-xl bg-slate-900 text-white text-xs font-bold\">Tutup\u003c/button>\n    \u003c/div>\n  \u003c/div>\n\n  \u003cscript>\n    const GAS_WEB_APP_URL = \"https://script.google.com/macros/s/AKfycbweu_PDwEIGHcY8qateu_CmmQx__4JGIAu2BjD9jiRoPuX0so_if183wZ9eWALwLnomdQ/exec\";\n\n    let state = {\n      pegawai: [],\n      respon: [],\n      images: { 1: null, 2: null, 3: null, 4: null }\n    };\n\n    document.addEventListener(\"DOMContentLoaded\", function() {\n      const today = new Date().toISOString().split('T')[0];\n      document.getElementById(\"tarikhLaporan\").value = today;\n      loadData();\n      updatePreview();\n    });\n\n    function switchTab(tab) {\n      document.getElementById(\"sec-dashboard\").classList.add(\"hidden\");\n      document.getElementById(\"sec-form\").classList.add(\"hidden\");\n      document.getElementById(\"sec-pegawai\").classList.add(\"hidden\");\n\n      const inactiveTabClass = \"flex-1 whitespace-nowrap px-2 py-2 text-xs font-semibold rounded-lg transition-all text-slate-300 hover:text-white sm:flex-none sm:px-4 sm:text-sm\";\n      const activeTabClass = \"flex-1 whitespace-nowrap px-2 py-2 text-xs font-semibold rounded-lg transition-all bg-slate-100 text-slate-900 shadow sm:flex-none sm:px-4 sm:text-sm\";\n      document.getElementById(\"tab-dashboard\").className = inactiveTabClass;\n      document.getElementById(\"tab-form\").className = inactiveTabClass;\n      document.getElementById(\"tab-pegawai\").className = inactiveTabClass;\n\n      document.getElementById(\"sec-\" + tab).classList.remove(\"hidden\");\n      const activeBtn = document.getElementById(\"tab-\" + tab);\n      activeBtn.className = activeTabClass;\n      if (tab === \"form\") requestAnimationFrame(() => updatePreview());\n    }\n\n    // Helper penukar format tarikh kepada YYYY-MM-DD\n    function formatDateForInput(dateStr) {\n      if (!dateStr) return \"\";\n      const d = new Date(dateStr);\n      if (!isNaN(d.getTime())) {\n        const year = d.getFullYear();\n        const month = String(d.getMonth() + 1).padStart(2, '0');\n        const day = String(d.getDate()).padStart(2, '0');\n        return `${year}-${month}-${day}`;\n      }\n      const match = String(dateStr).match(/\\d{4}-\\d{2}-\\d{2}/);\n      return match ? match[0] : \"\";\n    }\n\n    async function loadData(isRefresh = false) {\n      const refreshSpinner = document.getElementById(\"refreshSpinner\");\n      if (isRefresh && refreshSpinner) refreshSpinner.classList.add(\"fa-spin\");\n\n      try {\n        const response = await fetch(`${GAS_WEB_APP_URL}?action=getInitialData`);\n        const result = await response.json();\n\n        if (result.status === \"success\") {\n          state.pegawai = result.pegawai || [];\n          state.respon = result.respon || [];\n\n          renderStats();\n          renderTable(state.respon);\n          populatePegawaiDropdown();\n          renderPegawaiGrid();\n        }\n      } catch (err) {\n        console.error(\"Gagal tarik data:\", err);\n      } finally {\n        if (isRefresh && refreshSpinner) refreshSpinner.classList.remove(\"fa-spin\");\n      }\n    }\n\n    function renderStats() {\n      document.getElementById(\"statTotalOpr\").innerText = state.respon.length;\n      document.getElementById(\"statTotalPegawai\").innerText = state.pegawai.length;\n      \n      const thisMonth = new Date().getMonth();\n      const countMonth = state.respon.filter(r => r.timestamp && new Date(r.timestamp).getMonth() === thisMonth).length;\n      document.getElementById(\"statMonthOpr\").innerText = countMonth;\n    }\n\n    function renderTable(data) {\n      const tbody = document.getElementById(\"oprTableBody\");\n      if (data.length === 0) {\n        tbody.innerHTML = `\u003ctr>\u003ctd colspan=\"5\" class=\"py-8 text-center text-slate-400\">Tiada laporan OPR direkodkan lagi.\u003c/td>\u003c/tr>`;\n        return;\n      }\n\n      tbody.innerHTML = data.map(r => `\n        \u003ctr class=\"hover:bg-slate-50 transition border-b border-slate-200\">\n          \u003ctd class=\"py-3 px-4 font-mono text-[11px] text-slate-500\">${r.timestamp || '-'}\u003c/td>\n          \u003ctd class=\"py-3 px-4 font-bold text-slate-900\">${r.tajukProgram}\u003c/td>\n          \u003ctd class=\"py-3 px-4 text-slate-600\">${r.tarikhPelaksanaan}\u003c/td>\n          \u003ctd class=\"py-3 px-4 text-slate-700\">${r.namaPegawai}\u003c/td>\n          \u003ctd class=\"py-3 px-4 text-center\">\n            \u003cbutton onclick='loadOprForEdit(${JSON.stringify(r).replace(/'/g, \"&apos;\")})' class=\"px-3 py-1 bg-slate-900 text-white hover:bg-slate-800 rounded-lg font-bold text-[11px] transition space-x-1 shadow-sm\">\n              \u003ci class=\"fa-solid fa-pen-to-square\">\u003c/i>\n              \u003cspan>Edit & Cetak\u003c/span>\n            \u003c/button>\n          \u003c/td>\n        \u003c/tr>\n      `).join(\"\");\n    }\n\n    function filterTable() {\n      const q = document.getElementById(\"searchInput\").value.toLowerCase();\n      const filtered = state.respon.filter(r => \n        r.tajukProgram.toLowerCase().includes(q) || \n        r.namaPegawai.toLowerCase().includes(q)\n      );\n      renderTable(filtered);\n    }\n\n    function populatePegawaiDropdown() {\n      const field = document.getElementById(\"namaPegawai\");\n      if (field) field.value = field.value || \"\";\n      hidePegawaiSuggestions();\n    }\n\n    function hidePegawaiSuggestions() {\n      const list = document.getElementById(\"pegawaiSuggestions\");\n      if (list) {\n        list.innerHTML = \"\";\n        list.classList.add(\"hidden\");\n      }\n    }\n\n    function filterPegawaiSuggestions() {\n      const field = document.getElementById(\"namaPegawai\");\n      const list = document.getElementById(\"pegawaiSuggestions\");\n      if (!field || !list) return;\n      const query = field.value.trim().toLocaleLowerCase(\"ms-MY\");\n      autoFillJawatan();\n      if (!query) return hidePegawaiSuggestions();\n      const matches = state.pegawai\n        .filter(person => person.nama.toLocaleLowerCase(\"ms-MY\").includes(query))\n        .slice(0, 8);\n      list.innerHTML = \"\";\n      if (!matches.length) return hidePegawaiSuggestions();\n      matches.forEach(person => {\n        const button = document.createElement(\"button\");\n        button.type = \"button\";\n        button.className = \"w-full px-3 py-2 text-left hover:bg-slate-50 border-b last:border-b-0 border-slate-100 transition\";\n        const name = document.createElement(\"span\");\n        name.className = \"block text-xs font-bold text-slate-800\";\n        name.textContent = person.nama;\n        const position = document.createElement(\"span\");\n        position.className = \"block text-[10px] text-slate-500 mt-0.5\";\n        position.textContent = person.jawatan || \"\";\n        button.append(name, position);\n        button.addEventListener(\"mousedown\", event => {\n          event.preventDefault();\n          selectPegawai(person.nama);\n        });\n        list.appendChild(button);\n      });\n      list.classList.remove(\"hidden\");\n    }\n\n    function selectPegawai(name) {\n      document.getElementById(\"namaPegawai\").value = name;\n      autoFillJawatan();\n      hidePegawaiSuggestions();\n    }\n\n    function autoFillJawatan() {\n      const selectedName = document.getElementById(\"namaPegawai\").value.trim();\n      const found = state.pegawai.find(p => p.nama === selectedName);\n      if (found) {\n        document.getElementById(\"jawatanPegawai\").value = found.jawatan;\n      }\n      updatePreview();\n    }\n\n    document.addEventListener(\"click\", event => {\n      if (!event.target.closest(\"#namaPegawai\") && !event.target.closest(\"#pegawaiSuggestions\")) hidePegawaiSuggestions();\n    });\n\n    function compressImage(file, maxWidth = 1000, quality = 0.7) {\n      return new Promise((resolve) => {\n        const reader = new FileReader();\n        reader.readAsDataURL(file);\n        reader.onload = (event) => {\n          const img = new Image();\n          img.src = event.target.result;\n          img.onload = () => {\n            const canvas = document.createElement('canvas');\n            let width = img.width;\n            let height = img.height;\n            if (width > maxWidth) {\n              height = Math.round((height * maxWidth) / width);\n              width = maxWidth;\n            }\n            canvas.width = width;\n            canvas.height = height;\n            const ctx = canvas.getContext('2d');\n            ctx.drawImage(img, 0, 0, width, height);\n            resolve(canvas.toDataURL('image/jpeg', quality));\n          };\n        };\n      });\n    }\n\n    async function processAndUploadImage(e, index) {\n      const file = e.target.files[0];\n      if (file) {\n        const compressedBase64 = await compressImage(file);\n        state.images[index] = compressedBase64;\n        updatePreview();\n      }\n    }\n\n    function updatePreview() {\n      document.getElementById(\"prevTajuk\").innerText = document.getElementById(\"tajukProgram\").value || \"\";\n      document.getElementById(\"prevTarikh\").innerText = document.getElementById(\"tarikhPelaksanaan\").value || \"\";\n      document.getElementById(\"prevMasa\").innerText = document.getElementById(\"masa\").value || \"\";\n      document.getElementById(\"prevSasaran\").innerText = document.getElementById(\"sasaran\").value || \"\";\n      \n      const pelibatanVal = document.getElementById(\"pelibatan\").value;\n      if (pelibatanVal) {\n        document.getElementById(\"prevPelibatan\").innerText = pelibatanVal;\n        document.getElementById(\"prevPelibatanBox\").classList.remove(\"hidden\");\n      } else {\n        document.getElementById(\"prevPelibatanBox\").classList.add(\"hidden\");\n      }\n\n      document.getElementById(\"prevObjektif\").innerText = document.getElementById(\"objektif\").value || \"\";\n      document.getElementById(\"prevKekuatan\").innerText = document.getElementById(\"kekuatan\").value || \"\";\n      document.getElementById(\"prevPenambahbaikan\").innerText = document.getElementById(\"penambahbaikan\").value || \"\";\n      document.getElementById(\"prevNama\").innerText = document.getElementById(\"namaPegawai\").value || \"\";\n      document.getElementById(\"prevJawatan\").innerText = document.getElementById(\"jawatanPegawai\").value || \"\";\n      document.getElementById(\"prevTarikhLaporan\").innerText = document.getElementById(\"tarikhLaporan\").value || \"\";\n\n      // Kemaskini Pratonton Gambar 1 (Hero)\n      const img1El = document.getElementById(\"prevImg1\");\n      if (state.images[1]) {\n        img1El.src = state.images[1];\n        img1El.classList.remove(\"hidden\");\n      } else {\n        img1El.src = \"\";\n        img1El.classList.add(\"hidden\");\n      }\n\n      // Kemaskini Pratonton Gambar 2, 3, 4\n      let hasGallery = false;\n      for (let i = 2; i \u003c= 4; i++) {\n        const boxEl = document.getElementById(`boxImg${i}`);\n        const imgEl = document.getElementById(`prevImg${i}`);\n        const capVal = document.getElementById(`kapsyen${i}`).value;\n        const capEl = document.getElementById(`prevCap${i}`);\n\n        if (capEl) capEl.innerText = capVal || `Gambar ${i}`;\n\n        if (state.images[i]) {\n          if (imgEl) imgEl.src = state.images[i];\n          if (boxEl) boxEl.classList.remove(\"hidden\");\n          hasGallery = true;\n        } else {\n          if (imgEl) imgEl.src = \"\";\n          if (boxEl) boxEl.classList.add(\"hidden\");\n        }\n      }\n\n      if (hasGallery) {\n        document.getElementById(\"prevGalleryBox\").classList.remove(\"hidden\");\n      } else {\n        document.getElementById(\"prevGalleryBox\").classList.add(\"hidden\");\n      }\n    }\n\n    function clearField(fieldId) {\n      document.getElementById(fieldId).value = \"\";\n      updatePreview();\n    }\n\n    function structuredPrefix(type) {\n      return type === \"objektif\" ? \"1. \" : \"● \";\n    }\n\n    function handleStructuredInput(field, type) {\n      // Melindungi input tampal atau teks yang ditaip selepas medan dikosongkan.\n      if (field.value && !field.value.trimStart().match(type === \"objektif\" ? /^\\d+\\.\\s*/ : /^[●•\\-*]\\s*/)) {\n        const cursor = field.selectionStart;\n        const prefix = structuredPrefix(type);\n        field.value = prefix + field.value.trimStart();\n        field.setSelectionRange(cursor + prefix.length, cursor + prefix.length);\n      }\n      updatePreview();\n    }\n\n    function handleStructuredEnter(event, type) {\n      const field = event.target;\n      // Letakkan penanda sebelum aksara pertama ditaip, bukan selepas Enter.\n      if (event.key.length === 1 && !event.ctrlKey && !event.metaKey && !event.altKey && !event.isComposing && !field.value.trim()) {\n        const prefix = structuredPrefix(type);\n        field.value = prefix;\n        field.setSelectionRange(prefix.length, prefix.length);\n      }\n\n      if (event.key !== \"Enter\" || event.shiftKey || event.isComposing) return;\n      event.preventDefault();\n      const start = field.selectionStart;\n      const currentLine = field.value.slice(0, start).split(\"\\n\").pop();\n      let nextPrefix;\n\n      if (type === \"objektif\") {\n        const numbered = currentLine.match(/^(\\s*)(\\d+)\\.\\s*/);\n        nextPrefix = numbered ? `${numbered[1]}${Number(numbered[2]) + 1}. ` : \"1. \";\n      } else {\n        const bulleted = currentLine.match(/^(\\s*)[●•\\-*]\\s*/);\n        nextPrefix = bulleted ? `${bulleted[1]}● ` : \"● \";\n      }\n\n      field.setRangeText(`\\n${nextPrefix}`, start, field.selectionEnd, \"end\");\n      updatePreview();\n    }\n\n    function resetOprForm() {\n      if (confirm(\"Adakah anda pasti untuk mengosongkan borang?\")) {\n        document.getElementById(\"oprForm\").reset();\n        document.getElementById(\"editRowId\").value = \"\";\n        state.images = { 1: null, 2: null, 3: null, 4: null };\n        \n        for (let i = 1; i \u003c= 4; i++) {\n          const fEl = document.getElementById(`fileImg${i}`);\n          if (fEl) fEl.value = \"\";\n        }\n\n        const today = new Date().toISOString().split('T')[0];\n        document.getElementById(\"tarikhLaporan\").value = today;\n        document.getElementById(\"submitBtnText\").innerText = \"Cetak / Simpan Sebagai PDF & Hantar Data\";\n        updatePreview();\n      }\n    }\n\n    const suggestionStocks = {\n      objektif: [\n        \"Meningkatkan kefahaman {sasaran} berkaitan pengisian dan pelaksanaan {tajuk}.\",\n        \"Memperkukuh pengetahuan serta kemahiran {sasaran} melalui pendedahan yang terancang.\",\n        \"Menyediakan ruang pembelajaran aktif untuk {sasaran} berkongsi pengalaman dan amalan terbaik.\",\n        \"Meningkatkan keupayaan {sasaran} mengaplikasikan input program dalam tugas dan tindakan susulan.\",\n        \"Menyelaras hala tuju pelaksanaan antara {sasaran} agar selari dengan keperluan semasa.\",\n        \"Membina keyakinan {sasaran} untuk melaksanakan inisiatif yang diperoleh secara lebih berkesan.\",\n        \"Memantapkan kompetensi profesional {sasaran} menerusi perkongsian input yang relevan.\",\n        \"Menggalakkan budaya pembelajaran berterusan dalam kalangan {sasaran}.\",\n        \"Memperluas jaringan kerjasama dan perkongsian idea dalam kalangan {sasaran}.\",\n        \"Memberi pendedahan kepada {sasaran} terhadap pendekatan, strategi dan amalan semasa.\",\n        \"Meningkatkan kesedaran {sasaran} terhadap peranan masing-masing dalam menjayakan program.\",\n        \"Memudah cara {sasaran} mengenal pasti langkah praktikal yang boleh dilaksanakan selepas program.\",\n        \"Memperkasa {sasaran} untuk membuat perancangan dan keputusan yang lebih berfokus.\",\n        \"Mewujudkan kefahaman bersama dalam kalangan {sasaran} terhadap matlamat {tajuk}.\",\n        \"Mengukuhkan penguasaan {sasaran} terhadap kaedah pelaksanaan yang sistematik dan berimpak.\",\n        \"Merangsang idea baharu serta inovasi dalam kalangan {sasaran} melalui sesi interaktif.\",\n        \"Meningkatkan kesediaan {sasaran} untuk menghadapi cabaran pelaksanaan di peringkat masing-masing.\",\n        \"Membudayakan amalan refleksi dan penambahbaikan berterusan dalam kalangan {sasaran}.\",\n        \"Memastikan {sasaran} mendapat maklumat yang tepat, jelas dan boleh dilaksanakan.\",\n        \"Menggalakkan kolaborasi yang lebih erat antara {sasaran} dan pihak berkaitan.\"\n      ],\n      kekuatan: [\n        \"Komitmen dan penglibatan aktif {sasaran} sepanjang pelaksanaan program.\",\n        \"Pengisian program yang jelas, tersusun dan menepati keperluan {sasaran}.\",\n        \"Kerjasama baik antara urus setia, penceramah dan peserta telah melancarkan perjalanan program.\",\n        \"Penyampaian yang interaktif berjaya menarik perhatian serta menggalakkan penglibatan peserta.\",\n        \"Pengurusan masa program berjalan dengan teratur mengikut tentatif yang ditetapkan.\",\n        \"Maklum balas peserta menunjukkan penerimaan yang baik terhadap pengisian program.\",\n        \"Penceramah berjaya menyampaikan input secara berfokus, jelas dan mudah difahami.\",\n        \"Bahan pembentangan dan aktiviti yang disediakan menyokong pemahaman peserta dengan baik.\",\n        \"Suasana pembelajaran yang positif mendorong peserta untuk bertanya dan berkongsi pandangan.\",\n        \"Penglibatan pihak berkaitan membantu memperkukuh kelancaran pelaksanaan program.\",\n        \"Sesi perkongsian pengalaman memberi nilai tambah kepada {sasaran}.\",\n        \"Aktiviti yang dilaksanakan bersesuaian dengan objektif dan hasil yang disasarkan.\",\n        \"Urus setia memberi respons yang cekap terhadap keperluan peserta sepanjang program.\",\n        \"Penggunaan kaedah pelaksanaan yang pelbagai menjadikan program lebih menarik dan berkesan.\",\n        \"Peserta menunjukkan kesediaan untuk mengaplikasikan input yang diperoleh dalam tugas masing-masing.\",\n        \"Komunikasi yang baik antara semua pihak membantu mengelakkan sebarang gangguan pelaksanaan.\",\n        \"Sokongan pengurusan dan pihak kerjasama menyumbang kepada kejayaan program.\",\n        \"Dokumentasi serta penyelarasan awal yang baik memudahkan urusan pelaksanaan.\",\n        \"Sesi soal jawab memberi peluang kepada peserta mendapatkan penjelasan secara langsung.\",\n        \"Objektif program dapat disampaikan dengan jelas melalui pengisian yang relevan dan praktikal.\"\n      ],\n      penambahbaikan: [\n        \"Memanjangkan tempoh sesi praktikal supaya peserta mempunyai lebih ruang untuk mengaplikasikan input.\",\n        \"Menyediakan bahan rujukan awal agar peserta dapat membuat persediaan sebelum program berlangsung.\",\n        \"Memperbanyak aktiviti kumpulan bagi menggalakkan penglibatan dan perkongsian idea peserta.\",\n        \"Menyediakan sesi susulan untuk memantau pelaksanaan input program di peringkat masing-masing.\",\n        \"Menambah masa bagi sesi soal jawab untuk membolehkan isu peserta ditangani dengan lebih menyeluruh.\",\n        \"Memperluas hebahan awal supaya penyertaan daripada kumpulan sasaran dapat ditingkatkan.\",\n        \"Menyediakan contoh amalan terbaik yang lebih pelbagai dan dekat dengan situasi sebenar peserta.\",\n        \"Menggunakan borang maklum balas yang lebih terperinci untuk menilai keberkesanan program.\",\n        \"Memastikan bahan pembentangan dikongsi selepas program sebagai rujukan peserta.\",\n        \"Memperkemas pengurusan masa setiap slot agar semua pengisian dapat disampaikan dengan optimum.\",\n        \"Menyusun aktiviti mengikut tahap keperluan peserta supaya pengisian lebih bersasar.\",\n        \"Mewujudkan kumpulan sokongan atau saluran komunikasi bagi tindakan susulan selepas program.\",\n        \"Menambah elemen demonstrasi dan latihan amali untuk mengukuhkan kefahaman peserta.\",\n        \"Mendapatkan keperluan awal peserta melalui tinjauan ringkas sebelum menetapkan pengisian.\",\n        \"Memperluas penglibatan rakan strategik bagi menambah nilai kepada pelaksanaan program.\",\n        \"Menyediakan panduan tindakan ringkas supaya peserta dapat melaksanakan susulan dengan lebih yakin.\",\n        \"Mengadakan sesi perkongsian susulan bagi menilai cabaran dan kejayaan pelaksanaan.\",\n        \"Memastikan kemudahan teknikal diuji lebih awal untuk mengelakkan gangguan semasa program.\",\n        \"Menambah variasi kaedah penyampaian bagi mengekalkan fokus dan minat peserta.\",\n        \"Merekod dapatan dan cadangan peserta untuk penambahbaikan penganjuran pada masa hadapan.\"\n      ]\n    };\n\n    function normaliseSuggestionText(value, fallback) {\n      const text = String(value || \"\").trim().replace(/\\s+/g, \" \");\n      return (text || fallback).toLocaleLowerCase(\"ms-MY\");\n    }\n\n    function pickSuggestions(fieldType, tajuk, sasaran) {\n      const stock = suggestionStocks[fieldType] || [];\n      const selected = [...stock].sort(() => Math.random() - 0.5).slice(0, 3);\n      const target = normaliseSuggestionText(sasaran, \"peserta\");\n      const program = normaliseSuggestionText(tajuk, \"program ini\");\n      return selected.map((text, index) => {\n        const sentence = text.replaceAll(\"{tajuk}\", program).replaceAll(\"{sasaran}\", target);\n        return fieldType === \"objektif\" ? `${index + 1}. ${sentence}` : `● ${sentence}`;\n      }).join(\"\\n\");\n    }\n\n    function getAISuggestion(fieldType) {\n      const tajuk = document.getElementById(\"tajukProgram\").value;\n      const sasaran = document.getElementById(\"sasaran\").value;\n\n      if (!tajuk) {\n        alert(\"Sila isi 'Tajuk Program' terlebih dahulu.\");\n        document.getElementById(\"tajukProgram\").focus();\n        return;\n      }\n\n      const targetField = document.getElementById(fieldType);\n      targetField.value = pickSuggestions(fieldType, tajuk, sasaran);\n      updatePreview();\n    }\n\n    function triggerPrint() {\n      window.print();\n    }\n\n    async function handleSaveAndPrint(e) {\n      e.preventDefault();\n      \n      triggerPrint();\n\n      const submitBtn = document.getElementById(\"submitBtn\");\n      submitBtn.disabled = true;\n      submitBtn.innerHTML = `\u003ci class=\"fa-solid fa-spinner fa-spin\">\u003c/i> \u003cspan>Menyimpan Rekod...\u003c/span>`;\n\n      const payload = {\n        editRowId: document.getElementById(\"editRowId\").value || \"\",\n        namaPegawai: document.getElementById(\"namaPegawai\").value,\n        jawatanPegawai: document.getElementById(\"jawatanPegawai\").value,\n        tarikhLaporan: document.getElementById(\"tarikhLaporan\").value,\n        tajukProgram: document.getElementById(\"tajukProgram\").value,\n        tarikhPelaksanaan: document.getElementById(\"tarikhPelaksanaan\").value,\n        masa: document.getElementById(\"masa\").value,\n        sasaran: document.getElementById(\"sasaran\").value,\n        pelibatan: document.getElementById(\"pelibatan\").value,\n        objektif: document.getElementById(\"objektif\").value,\n        kekuatan: document.getElementById(\"kekuatan\").value,\n        penambahbaikan: document.getElementById(\"penambahbaikan\").value,\n        gambar1: state.images[1] || \"\",\n        gambar2: state.images[2] || \"\",\n        kapsyen2: document.getElementById(\"kapsyen2\").value,\n        gambar3: state.images[3] || \"\",\n        kapsyen3: document.getElementById(\"kapsyen3\").value,\n        gambar4: state.images[4] || \"\",\n        kapsyen4: document.getElementById(\"kapsyen4\").value\n      };\n\n      try {\n        const res = await fetch(GAS_WEB_APP_URL, {\n          method: \"POST\",\n          body: JSON.stringify(payload)\n        });\n        const result = await res.json();\n\n        if (result.status === \"success\") {\n          alert(\"Rekod OPR berjaya dikemaskini dalam sistem!\");\n          await loadData(true);\n        } else {\n          alert(\"Ralat simpan data: \" + result.message);\n        }\n      } catch (err) {\n        console.error(\"Ralat simpan:\", err);\n      } finally {\n        submitBtn.disabled = false;\n        submitBtn.innerHTML = `\u003ci class=\"fa-solid fa-print\">\u003c/i> \u003cspan id=\"submitBtnText\">Cetak / Simpan Sebagai PDF & Hantar Data\u003c/span>`;\n      }\n    }\n\n    function loadOprForEdit(data) {\n      switchTab('form');\n\n      document.getElementById(\"editRowId\").value = data.id || \"\";\n      document.getElementById(\"namaPegawai\").value = data.namaPegawai || \"\";\n      document.getElementById(\"jawatanPegawai\").value = data.jawatanPegawai || \"\";\n      document.getElementById(\"tarikhLaporan\").value = formatDateForInput(data.tarikhLaporan);\n      document.getElementById(\"tajukProgram\").value = data.tajukProgram || \"\";\n      document.getElementById(\"tarikhPelaksanaan\").value = data.tarikhPelaksanaan || \"\";\n      document.getElementById(\"masa\").value = data.masa || \"\";\n      document.getElementById(\"sasaran\").value = data.sasaran || \"\";\n      document.getElementById(\"pelibatan\").value = data.pelibatan || \"\";\n      document.getElementById(\"objektif\").value = data.objektif || \"\";\n      document.getElementById(\"kekuatan\").value = data.kekuatan || \"\";\n      document.getElementById(\"penambahbaikan\").value = data.penambahbaikan || \"\";\n\n      document.getElementById(\"kapsyen2\").value = data.kapsyen2 || \"\";\n      document.getElementById(\"kapsyen3\").value = data.kapsyen3 || \"\";\n      document.getElementById(\"kapsyen4\").value = data.kapsyen4 || \"\";\n\n      for (let i = 1; i \u003c= 4; i++) {\n        const fEl = document.getElementById(`fileImg${i}`);\n        if (fEl) fEl.value = \"\";\n      }\n\n      state.images = {\n        1: data.gambar1 || null,\n        2: data.gambar2 || null,\n        3: data.gambar3 || null,\n        4: data.gambar4 || null\n      };\n\n      document.getElementById(\"submitBtnText\").innerText = \"Kemaskini Rekod & Cetak PDF\";\n      closeModal();\n      updatePreview();\n    }\n\n    function renderPegawaiGrid() {\n      const grid = document.getElementById(\"pegawaiGrid\");\n      if (state.pegawai.length === 0) {\n        grid.innerHTML = `\u003cp class=\"col-span-3 text-slate-400 text-xs\">Tiada data pegawai.\u003c/p>`;\n        return;\n      }\n\n      grid.innerHTML = state.pegawai.map(p => {\n        const oprs = state.respon.filter(r => r.namaPegawai === p.nama);\n        const jawatanRingkas = String(p.jawatan || \"\").trim().toUpperCase() === \"SCHOOL IMPROVEMENT SPECIALIST COACH\" ? \"SISC+\" : p.jawatan;\n        return `\n          \u003cdiv onclick=\"openHistoryModal('${p.nama}')\" class=\"p-5 min-h-[158px] bg-white border border-slate-200 rounded-2xl shadow-sm hover:shadow transition cursor-pointer flex items-start space-x-4\">\n            \u003cdiv class=\"w-12 h-12 rounded-full bg-slate-900 text-white flex items-center justify-center font-bold text-lg\">\n              ${p.nama.charAt(0)}\n            \u003c/div>\n            \u003cdiv class=\"flex-1 min-w-0\">\n              \u003ch4 class=\"font-bold text-slate-900 text-sm truncate\">${p.nama}\u003c/h4>\n              \u003cp class=\"officer-job-title text-xs text-slate-500 leading-snug min-h-[2.5rem]\">${jawatanRingkas || \"\"}\u003c/p>\n              \u003cdiv class=\"mt-3 flex items-center justify-between text-xs\">\n                \u003cspan class=\"font-bold text-slate-700 bg-slate-100 px-2.5 py-1 rounded-lg\">${oprs.length} OPR Dihantar\u003c/span>\n                \u003cspan class=\"text-slate-500 font-bold\">Lihat \u003ci class=\"fa-solid fa-chevron-right text-[10px]\">\u003c/i>\u003c/span>\n              \u003c/div>\n            \u003c/div>\n          \u003c/div>\n        `;\n      }).join(\"\");\n    }\n\n    function openHistoryModal(namaPegawai) {\n      const p = state.pegawai.find(x => x.nama === namaPegawai);\n      const oprs = state.respon.filter(r => r.namaPegawai === namaPegawai);\n\n      document.getElementById(\"modalPegawaiName\").innerText = namaPegawai;\n      document.getElementById(\"modalPegawaiJawatan\").innerText = p ? p.jawatan : \"\";\n\n      const modalList = document.getElementById(\"modalOprList\");\n      if (oprs.length === 0) {\n        modalList.innerHTML = `\u003cp class=\"text-center text-slate-400 py-8 text-xs\">Pegawai ini belum pernah menghantar OPR.\u003c/p>`;\n      } else {\n        modalList.innerHTML = oprs.map(r => `\n          \u003cdiv class=\"p-4 rounded-xl border border-slate-200 bg-slate-50 flex items-center justify-between\">\n            \u003cdiv>\n              \u003ch5 class=\"font-bold text-slate-900 text-xs\">${r.tajukProgram}\u003c/h5>\n              \u003cp class=\"text-[11px] text-slate-500 mt-0.5\">\u003ci class=\"fa-regular fa-calendar\">\u003c/i> ${r.tarikhPelaksanaan} | ${r.masa}\u003c/p>\n            \u003c/div>\n            \u003cbutton onclick='loadOprForEdit(${JSON.stringify(r).replace(/'/g, \"&apos;\")})' class=\"px-3 py-1.5 bg-slate-900 hover:bg-slate-800 text-white rounded-lg text-xs font-bold transition flex items-center space-x-1\">\n              \u003ci class=\"fa-solid fa-pen-to-square\">\u003c/i>\n              \u003cspan>Edit / Cetak\u003c/span>\n            \u003c/button>\n          \u003c/div>\n        `).join(\"\");\n      }\n\n      document.getElementById(\"historyModal\").classList.remove(\"hidden\");\n    }\n\n    function closeModal() {\n      document.getElementById(\"historyModal\").classList.add(\"hidden\");\n    }\n  \u003c/script>\n  \u003cscript src=\"app-v15.js?v=20\">\u003c/script>\n\u003c/body>\n\u003c/html>\n");
    document.close();
  };
  const remaining = deadline - Date.now();
  if (remaining <= 0) reopen();
  else window.setTimeout(reopen, remaining);
})();
